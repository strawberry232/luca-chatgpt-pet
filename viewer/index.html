<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>卢卡 · 动作与视线预览</title>
  <style>
    :root{font-family:"Microsoft YaHei",system-ui,sans-serif;color:#3d3934;background:#f7f5ef;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0}main{max-width:1060px;margin:auto;padding:42px 28px}header{display:flex;align-items:flex-start;justify-content:space-between;gap:24px}.eyebrow{font-size:12px;letter-spacing:.18em;color:#77796a}h1{font-size:30px;font-weight:600;margin:10px 0 12px}p{line-height:1.8;color:#77746a;margin:0}button,select{font:inherit}button{cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #809578;outline-offset:3px}.language{padding:9px 13px;background:transparent;border:1px solid #d8d7ca;border-radius:10px;white-space:nowrap}.layout{display:grid;grid-template-columns:1fr 285px;gap:22px;margin-top:30px}.scene{position:relative;min-height:480px;background:radial-gradient(ellipse at center,#fffef9 0%,#f3f2e8 74%);border:1px solid #e3e2d5;border-radius:24px;display:flex;justify-content:center;align-items:center;overflow:hidden}.pet-wrap{position:relative;width:288px;height:312px}canvas{width:288px;height:312px;display:block;image-rendering:pixelated}.direction{position:absolute;top:20px;left:24px;font-size:13px;color:#6f7c64}.status{position:absolute;bottom:22px;padding:8px 15px;border-radius:30px;background:#ffffffb0;font-size:13px;color:#6b695f}.compass{position:absolute;inset:0;pointer-events:none}.compass span{position:absolute;font-size:12px;color:#aaa99c}.north{top:22px;left:50%}.east{right:22px;top:50%}.south{bottom:22px;left:50%}.west{left:22px;top:50%}.controls{display:flex;flex-direction:column;gap:18px}.card{background:#fffef9;border:1px solid #e3e2d5;border-radius:20px;padding:22px}.card h2{font-size:14px;font-weight:600;margin:0 0 16px}.modes{display:flex;flex-direction:column;gap:9px}.modes button{background:#f5f4eb;border:1px solid transparent;border-radius:12px;padding:12px 14px;text-align:left;color:#68665c}.modes button[aria-pressed="true"]{background:#e7eddf;border-color:#b4c1a6;color:#46583d}.hint{font-size:12px;margin-top:14px;line-height:1.8}select{width:100%;padding:10px;border:1px solid #d8d7ca;border-radius:10px;color:#4d5146;background:#fafaf4}.footnote{font-size:12px;line-height:1.9;margin-top:24px}.tag{display:inline-block;margin-top:14px;color:#737d66;font-size:12px}#load-error{color:#a24f49;padding:20px;display:none}@media(max-width:740px){main{padding:25px 18px}h1{font-size:24px}.layout{grid-template-columns:1fr}.scene{min-height:420px}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{padding:16px}.modes button{padding:10px}.language{font-size:12px}.direction{font-size:12px;left:15px}}@media(prefers-reduced-motion:reduce){canvas{image-rendering:auto}}
  </style>
</head>
<body>
<main>
  <header><div><div class="eyebrow">LUCA BALSA · COMPANION</div><h1 data-i18n="title">卢卡的陪伴时刻</h1><p data-i18n="intro">移动鼠标，看看卢卡在望向哪里。</p></div><button type="button" class="language" id="language">English</button></header>
  <div class="layout">
    <section class="scene" aria-label="Pet animation preview" id="scene">
      <div class="direction" data-i18n="directions">十六个注视方向，已有素材直接复用</div>
      <div class="compass" aria-hidden="true"><span class="north">↑</span><span class="east">→</span><span class="south">↓</span><span class="west">←</span></div>
      <div class="pet-wrap"><canvas id="pet" width="384" height="416" aria-label="囚徒卢卡动画预览"></canvas></div>
      <div class="status" id="status" aria-live="polite">待机</div>
      <p id="load-error">图集未能加载，请从项目文件夹打开预览，或使用完整的独立预览文件。</p>
    </section>
    <aside class="controls">
      <section class="card"><h2 data-i18n="action">选择动作</h2><div class="modes"><button data-mode="follow" aria-pressed="true" data-i18n="follow">跟随鼠标</button><button data-mode="idle" aria-pressed="false" data-i18n="idle">待机 · 眨眼</button><button data-mode="failed" aria-pressed="false" data-i18n="failed">失落 · 轻轻垂头</button></div><p class="hint" data-i18n="leave">鼠标离开窗口后，恢复待机。</p></section>
      <section class="card"><h2 data-i18n="timing">待机播放节奏</h2><select id="timing" aria-label="Idle playback timing"><option value="natural" data-i18n="natural">自然眨眼预览</option><option value="client" data-i18n="client">当前客户端固定节奏</option></select><p class="hint" id="timing-note"></p><span class="tag" data-i18n="sameHead">待机与失落复用同一头部原图</span></section>
    </aside>
  </div>
  <p class="footnote" data-i18n="scope">此页面已实现窗口内鼠标跟随。ChatGPT 浮窗的全局跟随和眨眼帧率由客户端控制，上传图集不会改写客户端行为。</p>
</main>
<script src="gaze.js"></script>
<script src="player.js"></script>
</body>
</html>
